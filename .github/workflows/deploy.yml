name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: haul123/im-server

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build and push image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Send deploy files
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/docker-compose.yaml,deploy/deploy.sh"
          target: "/home/ec2-user/im-app"
          strip_components: 1

      - name: Deploy (같은 EC2, 8090 포트)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ec2-user/im-app
            cat > .env <<EOF
            TAG=${{ github.sha }}
            DB_HOST=${{ secrets.IM_DB_HOST }}
            DB_PORT=${{ secrets.IM_DB_PORT }}
            DB_NAME=${{ secrets.IM_DB_NAME }}
            DB_USERNAME=${{ secrets.IM_DB_USERNAME }}
            DB_PASSWORD=${{ secrets.IM_DB_PASSWORD }}
            EOF
            chmod +x deploy.sh
            ./deploy.sh
            docker image prune -f
