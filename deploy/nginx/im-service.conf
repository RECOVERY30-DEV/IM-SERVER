# 참고용 사본 — EC2의 /etc/nginx/conf.d/im-service.conf에 수동으로 올라가 있다.
# 이 저장소의 배포 자동화(GitHub Actions)는 이 파일을 건드리지 않는다 — nginx/도메인/인증서
# 설정을 바꿀 때는 이 파일을 고치고 EC2에도 직접(scp + nginx -t + nginx -s reload) 반영할 것.
#
# recovery-server의 /etc/nginx/conf.d/service.conf(recovery-30.shop, 블루그린)와 같은 EC2에
# server_name 기반 가상호스팅으로 공존한다 — 서로 다른 conf.d 파일이라 독립적으로 수정 가능.

upstream im_backend {
    server 127.0.0.1:8090;
}

server {
    server_name im.recovery-30.shop;

    location / {
        proxy_pass http://im_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ipv6only=on은 프로세스 전체에서 한 번만 선언할 수 있다 — recovery-server의
    # service.conf가 이미 [::]:443에 대해 선언했으므로 여기서는 붙이지 않는다.
    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/im.recovery-30.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/im.recovery-30.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = im.recovery-30.shop) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name im.recovery-30.shop;
    return 404;
}
