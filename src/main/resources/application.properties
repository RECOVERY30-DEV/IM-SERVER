spring.application.name=server

# 로컬은 docker-compose.yml의 기본값과 맞춰뒀고, 배포 환경에서는 환경변수로 덮어쓰면 됨
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:im}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 리버스 프록시(nginx) 뒤에 있으므로 X-Forwarded-* 를 신뢰해 scheme/host 를 복원한다
# (springdoc 서버 URL, 리다이렉트 Location 등이 https 로 나오도록)
server.forward-headers-strategy=framework

# 스키마는 Flyway(db/migration)가 관리한다. Hibernate는 엔티티<->스키마 불일치만 검증
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS 허용 도메인. 배포 환경/프론트 도메인이 정해지면 CORS_ALLOWED_ORIGINS로 덮어쓸 것
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}

# 배포 플랫폼 헬스체크용 (health만 노출, 상세 정보는 숨김)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# implementation-spec.md 13.3.6 "조직 Salt를 포함한 단방향 Hash" — 운영에서는 반드시 PROOF_SALT로 덮어쓸 것
im.proof.salt=${PROOF_SALT:demo-salt-change-me}
im.proof.issuer-id=${PROOF_ISSUER_ID:im-bank-demo}
